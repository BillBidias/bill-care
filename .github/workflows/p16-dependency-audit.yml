name: P16 Dependency Security Audit

on:
  push:
    branches:
      - p16-dependency-security-audit-remediation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile for targeted patch updates
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Capture full dependency audit
        shell: bash
        run: npm audit --json > audit-all.json || true
      - name: Capture production dependency audit
        shell: bash
        run: npm audit --omit=dev --json > audit-prod.json || true
      - name: Print audit summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['audit-all.json', 'audit-prod.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`=== ${file} ===`);
            console.log(JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
          }
          NODE
      - name: Commit validated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "P16: persist validated dependency security lockfile"
          git push
