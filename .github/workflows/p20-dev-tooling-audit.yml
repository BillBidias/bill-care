name: P20 Dev Tooling Dependency Security Validation

on:
  push:
    branches:
      - p20-dev-tooling-dependency-security-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Baseline lint on main
        shell: bash
        run: |
          git worktree add /tmp/p20-main origin/main
          cd /tmp/p20-main
          npm ci >/tmp/p20-main-ci.log 2>&1
          npm run lint >/tmp/p20-main-lint.log 2>&1 || true
          echo '=== BASELINE MAIN LINT ==='
          cat /tmp/p20-main-lint.log
          echo '=== BASELINE COUNTS ==='
          grep -E 'problems \(' /tmp/p20-main-lint.log || true
      - name: Refresh candidate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Candidate lint
        shell: bash
        run: |
          npm run lint > /tmp/p20-candidate-lint.log 2>&1 || true
          cat /tmp/p20-candidate-lint.log
          echo '=== CANDIDATE COUNTS ==='
          grep -E 'problems \(' /tmp/p20-candidate-lint.log || true
      - run: npm test
      - run: npm run build
      - name: Full audit
        shell: bash
        run: npm audit --json > audit-all.json || true
      - name: Production audit guard
        shell: bash
        run: npm audit --omit=dev --json > audit-prod.json || true
      - name: Print audit summaries
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['audit-all.json','audit-prod.json']) {
            const data = JSON.parse(fs.readFileSync(file,'utf8'));
            console.log(`=== ${file} ===`);
            console.log(JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
            console.log('packages', Object.keys(data.vulnerabilities ?? {}));
            for (const [name, v] of Object.entries(data.vulnerabilities ?? {})) {
              console.log(JSON.stringify({name,severity:v.severity,range:v.range,nodes:v.nodes,via:v.via}, null, 2));
            }
          }
          NODE
      - name: Verify tooling resolutions
        run: npm ls @humanfs/node ajv brace-expansion browserslist flatted form-data js-yaml minimatch ws eslint @eslint/js autoprefixer jsdom typescript-eslint --all || true
      - name: Commit validated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "P20: persist validated dev tooling lockfile"
          git push
