name: P20 Dev Tooling Dependency Security Verification

on:
  push:
    branches:
      - p20-dev-tooling-dependency-security-audit
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify patched versions exist
        run: |
          echo '=== @humanfs/node@0.16.8 ==='
          npm view @humanfs/node@0.16.8 version
          echo '=== flatted@3.4.2 ==='
          npm view flatted@3.4.2 version
          echo '=== owning ranges ==='
          npm view eslint@9.39.5 dependencies --json
          npm view flat-cache@4.0.1 dependencies --json
