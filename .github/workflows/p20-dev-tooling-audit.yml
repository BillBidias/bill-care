name: P20 Dev Tooling Dependency Security Audit

on:
  push:
    branches:
      - p20-dev-tooling-dependency-security-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full audit
        shell: bash
        run: npm audit --json > audit-all.json || true
      - name: Production audit guard
        shell: bash
        run: npm audit --omit=dev --json > audit-prod.json || true
      - name: Print summaries
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['audit-all.json','audit-prod.json']) {
            const data = JSON.parse(fs.readFileSync(file,'utf8'));
            console.log(file, JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
          }
          NODE
      - name: Show ownership paths
        run: npm ls @humanfs/node ajv brace-expansion browserslist flatted form-data js-yaml minimatch ws eslint autoprefixer jsdom --all || true
      - name: Inspect same-major candidates
        run: |
          echo '=== eslint latest 9.x ==='
          npm view eslint@9 version --json
          echo '=== eslint 9.39.1 deps ==='
          npm view eslint@9.39.1 dependencies --json || true
          echo '=== @eslint/js latest 9.x ==='
          npm view @eslint/js@9 version --json
          echo '=== jsdom latest 20.x ==='
          npm view jsdom@20 version --json
          echo '=== jsdom 20.0.3 deps ==='
          npm view jsdom@20.0.3 dependencies --json
          echo '=== autoprefixer 10.5.5 peer/engines ==='
          npm view autoprefixer@10.5.5 peerDependencies --json
          npm view autoprefixer@10.5.5 engines --json
          echo '=== typescript-eslint latest 8.x peer ==='
          npm view typescript-eslint@8.69.0 peerDependencies --json
