name: P20 Dev Tooling Dependency Security Audit

on:
  push:
    branches:
      - p20-dev-tooling-dependency-security-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full audit
        shell: bash
        run: npm audit --json > audit-all.json || true
      - name: Production audit guard
        shell: bash
        run: npm audit --omit=dev --json > audit-prod.json || true
      - name: Print full vulnerability graph
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit-all.json','utf8'));
          console.log('FULL SUMMARY', JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, v] of Object.entries(data.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              range: v.range,
              effects: v.effects,
              fixAvailable: v.fixAvailable,
              nodes: v.nodes,
              via: (v.via ?? []).map(x => typeof x === 'string' ? x : ({source:x.source,name:x.name,severity:x.severity,title:x.title,range:x.range,url:x.url}))
            }, null, 2));
          }
          const prod = JSON.parse(fs.readFileSync('audit-prod.json','utf8'));
          console.log('PROD SUMMARY', JSON.stringify(prod.metadata?.vulnerabilities ?? {}, null, 2));
          NODE
      - name: Show ownership paths
        run: npm ls --all || true
      - name: Audit fix dry run only
        shell: bash
        run: npm audit fix --package-lock-only --dry-run --json > audit-fix-dry-run.json || true
      - name: Print dry-run proposal
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit-fix-dry-run.json','utf8'));
          console.log(JSON.stringify({added:data.added,removed:data.removed,changed:data.changed,audit:data.audit}, null, 2));
          NODE
