name: P18 Vite Build-Chain Validation

on:
  push:
    branches:
      - p18-vite-build-chain-security-remediation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Capture production audit
        shell: bash
        run: npm audit --omit=dev --json > audit-prod.json || true
      - name: Capture full audit
        shell: bash
        run: npm audit --json > audit-all.json || true
      - name: Print audit summaries
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['audit-prod.json','audit-all.json']) {
            const data = JSON.parse(fs.readFileSync(file,'utf8'));
            console.log(`=== ${file} ===`);
            console.log(JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
          }
          NODE
      - name: Show build-chain versions
        run: npm ls vite @vitejs/plugin-react-swc esbuild rollup postcss autoprefixer tailwindcss --all || true
      - name: Commit validated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "P18: persist validated Vite 7 lockfile"
          git push
