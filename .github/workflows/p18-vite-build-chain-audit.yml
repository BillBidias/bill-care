name: P18 Vite Build-Chain Audit

on:
  push:
    branches:
      - p18-vite-build-chain-security-remediation
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture full audit
        shell: bash
        run: npm audit --json > audit-all.json || true
      - name: Print detailed vulnerability graph
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit-all.json','utf8'));
          console.log('SUMMARY', JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, v] of Object.entries(data.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              range: v.range,
              effects: v.effects,
              fixAvailable: v.fixAvailable,
              via: (v.via ?? []).map(x => typeof x === 'string' ? x : ({source:x.source,name:x.name,severity:x.severity,title:x.title,range:x.range,url:x.url}))
            }, null, 2));
          }
          NODE
      - name: Show build-chain versions
        run: npm ls vite @vitejs/plugin-react-swc esbuild rollup postcss autoprefixer tailwindcss --all || true
