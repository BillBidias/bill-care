name: deploy

on:
 workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
    todo_job:
        name: TODO JOb 
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [18, 20]  # Der Job läuft dadurch zweimal parallel – einmal je Node-Version.
        steps:
            - uses: actions/checkout@v4
            - name: Node with Version ${{matrix.node-version}} einrichten
              uses: actions/setup-node@v4
              with:
                node-version: ${{matrix.node-version}}
                cache: "npm"
            - run: npm ci
            - run: npm run lint
            - run: npm run test -- --run
            - run: npm run build

