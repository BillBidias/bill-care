name: P21 Lint Error Remediation Gate

on:
  push:
    branches:
      - p21-lint-error-remediation-gate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile after Vite compatibility repair
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Lint snapshot
        shell: bash
        run: |
          npm run lint > lint.log 2>&1 || true
          cat lint.log
      - run: npm test
      - run: npm run build
      - name: Full audit
        run: npm audit
      - name: Production audit
        run: npm audit --omit=dev
      - name: Commit validated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "P21: persist validated Vite compatibility lockfile"
          git push
